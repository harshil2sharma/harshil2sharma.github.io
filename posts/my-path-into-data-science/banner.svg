<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img"
     aria-label="A wandering, uncertain line that gradually resolves into a single clean upward arc.">
  <defs>
    <linearGradient id="pathGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c9bda8"/>
      <stop offset="55%" stop-color="#c96a3f"/>
      <stop offset="100%" stop-color="#8f3f22"/>
    </linearGradient>
  </defs>

  <rect width="900" height="340" fill="#f1ece3"/>
  <line x1="50" y1="290" x2="860" y2="290" stroke="#e2d9c8" stroke-width="1.5"/>

  <!-- false starts, scattered and faint -->
  <circle cx="95" cy="172" r="3" fill="#b2532e" opacity="0.22"/>
  <circle cx="168" cy="252" r="2.5" fill="#b2532e" opacity="0.22"/>
  <circle cx="236" cy="178" r="3" fill="#b2532e" opacity="0.22"/>

  <!-- the uncertain early stretch -->
  <path d="M70,220 L110,193 L142,232 L182,198 L222,236 L262,205"
        fill="none" stroke="#b7ac95" stroke-width="2.25" opacity="0.75"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- where it resolves into one clean line -->
  <path d="M262,205 C342,176 418,160 480,140 C580,106 690,76 815,50"
        fill="none" stroke="url(#pathGrad)" stroke-width="3.5" stroke-linecap="round"/>

  <circle cx="815" cy="50" r="7" fill="#8f3f22"/>
</svg>
